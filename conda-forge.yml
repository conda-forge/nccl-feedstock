bot:
  automerge: true
  version_updates:
    allowed_tag_globs:
      - v*
    sources:
      - github
build_platform:
  linux_ppc64le: linux_64
conda_build:
  error_overlinking: true
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  linux_ppc64le: default
workflow_settings:
  free_disk_space: quick
