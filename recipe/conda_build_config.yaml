# c_stdlib_version is zipped with cuda_compiler_version in the global pinning, so this
# list must line up with the global one entry for entry. The only value that differs
# from global is the CUDA 12 slot, which uses 2.28 instead of 2.17.
c_stdlib_version:              # [linux]
  - 2.17                       # [linux and not riscv64]
  - 2.39                       # [linux and riscv64]
  - 2.28                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  - 2.28                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
